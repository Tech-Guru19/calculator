<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: grey;
        text-align: center;
        /* border: 2px solid black;
        border-radius: 20px; */
        font-family: sans-serif;
    }

    input {
        width: 300px;
        height: 30px;
    }

    h1 {
        margin-top: 20px !important;
        font-size: 42px;
        line-height: 92px;
        font-weight: bolder;
        font-family: sans-serif;
    }

    .container {
        width: 450px;
        margin-left: 700px;
        height: 275px;
        /* border-width: 10px; */
        /* border: 2px solid black; */
        border-radius: 20px;
        background-color: whitesmoke;
        justify-content: center;
    }

    .main {
        margin-top: 400px;
        align-items: center;
    }

    button {
        width: 50px;
        height: 30px;
        margin-left: 2px;
        border-radius: 5px;
        background-color: black;
        color: white;
        font-size: 20px;
    }
</style>

<body>
    <div class="container">
        <div class="main">
            <h1 style="margin-top: 150px !important;">Flex calculator</h1>
            <input type="number" id="num1" placeholder="First number" value="4500">
            <br><br>
            <input type="number" id="num2" placeholder="Second number">
            <br> <br>
            <button onclick="addition()">+</button>
            <button onclick="Subtract()">-</button>
            <button onclick="divide()">/</button>
            <button onclick="multiply()">*</button>
            <!-- <button>Solve</button> -->
            <div id="showAnswer" style="margin-top: 15px;">The answer will show here</div>
        </div>
    </div>
</body>
<script src="Script.js"></script>
